<!DOCTYPE html>
<html lang="fr"> 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compte à rebours – 30 octobre, 6h00</title>
<style>
:root{--bg:#f5f3ee;--fg:#1c1b19;--muted:#6b675f;--card:#fff;--accent:#d9480f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--fg:#f2efe8;--muted:#9a958a;--card:#1d1c1a;--accent:#ff8a4c}}
:root[data-theme="dark"]{--bg:#121110;--fg:#f2efe8;--muted:#9a958a;--card:#1d1c1a;--accent:#ff8a4c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
main{width:100%;max-width:720px}
h1{font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:600;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,16px)}
.box{background:var(--card);border-radius:16px;padding:clamp(14px,4vw,28px) 4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.num{font-size:clamp(2rem,10vw,4.5rem);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.lab{margin-top:8px;font-size:clamp(.7rem,2.5vw,.95rem);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#done{display:none;font-size:clamp(1.6rem,7vw,3rem);font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Compte à rebours</h1>
<p class="sub">Jusqu'au 30 octobre 2026 à 6h00 (heure de Paris)</p>
<div class="grid" id="grid">
<div class="box"><div class="num" id="d">--</div><div class="lab">Jours</div></div>
<div class="box"><div class="num" id="h">--</div><div class="lab">Heures</div></div>
<div class="box"><div class="num" id="m">--</div><div class="lab">Minutes</div></div>
<div class="box"><div class="num" id="s">--</div><div class="lab">Secondes</div></div>
</div>
<div id="done">C'est l'heure ! 🎉</div>
</main>
<script>
// 30 octobre 2026, 6h00 à Paris (CET, UTC+1 après le passage à l'heure d'hiver du 25 octobre)
var TARGET = new Date("2026-10-30T06:00:00+01:00").getTime();
function p(n){return String(n).padStart(2,"0")}
function tick(){
  var diff = TARGET - Date.now();
  if(diff <= 0){
    document.getElementById("grid").style.display="none";
    document.getElementById("done").style.display="block";
    return;
  }
  var s = Math.floor(diff/1000);
  document.getElementById("d").textContent = Math.floor(s/86400);
  document.getElementById("h").textContent = p(Math.floor(s%86400/3600));
  document.getElementById("m").textContent = p(Math.floor(s%3600/60));
  document.getElementById("s").textContent = p(s%60);
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
